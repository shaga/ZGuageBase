; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Isolate tool packages and keep Windows extraction paths short.
core_dir = C:/pio-tab5
default_envs = esp32p4_pioarduino

[env:esp32p4_pioarduino]
; Arduino-ESP32 3.3.9: ESP-Hosted BLE and Tab5 SDIO pin definitions.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
upload_speed = 1500000
monitor_speed = 115200
build_type = debug
framework = arduino
board = m5stack-tab5-p4
board_build.mcu = esp32p4
board_build.flash_mode = qio
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    https://github.com/M5Stack/M5Unified.git
    https://github.com/M5Stack/M5GFX.git

; Standalone BLE environment diagnostic; does not send railway commands.
[env:ble_check]
extends = env:esp32p4_pioarduino
build_src_filter = -<*> +<../diagnostics/ble_check.cpp>
